[theme]
base = "light"
primaryColor = "#0A66C2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F8FC"
textColor = "#16202C"
font = "sans serif"

[server]
# Serves ./static at /app/static. Images are referenced by URL instead of
# being base64-inlined, which is what kept the app inside its memory limit.
enableStaticServing = true

[browser]
gatherUsageStats = false
